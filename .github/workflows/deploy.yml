name: Deploy AI to ECS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-ecs-deploy
  cancel-in-progress: false
env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gangwon-v2-ai
  ECS_CLUSTER: gangwon-v2-cluster
  ECS_SERVICE: gangwon-v2-service
  ECS_TASK_FAMILY: gangwon-v2-app
  CONTAINER_NAME: ai
  SECRET_ARN: arn:aws:secretsmanager:ap-northeast-2:312743357029:secret:gangwon-v2/application-fuIdOu
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312743357029:role/gangwon-v2-github-ai-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition > task-definition.json
      - name: Normalize secret references
        run: |
          jq --arg secret "$SECRET_ARN" '
            (.containerDefinitions[] | select(.name == "backend").secrets) = [
              {"name":"SPRING_DATASOURCE_PASSWORD","valueFrom":($secret + ":SPRING_DATASOURCE_PASSWORD::")},
              {"name":"JWT_SECRET","valueFrom":($secret + ":JWT_SECRET::")},
              {"name":"PERSONAL_DATA_ENCRYPTION_KEY","valueFrom":($secret + ":PERSONAL_DATA_ENCRYPTION_KEY::")},
              {"name":"TOUR_API_KEY","valueFrom":($secret + ":TOUR_API_KEY::")},
              {"name":"AI_INTERNAL_API_KEY","valueFrom":($secret + ":AI_INTERNAL_API_KEY::")},
              {"name":"ELASTICSEARCH_REINDEX_KEY","valueFrom":($secret + ":ELASTICSEARCH_REINDEX_KEY::")}
            ]
            | (.containerDefinitions[] | select(.name == "ai").secrets) = [
              {"name":"INTERNAL_API_KEY","valueFrom":($secret + ":AI_INTERNAL_API_KEY::")}
            ]
          ' task-definition.json > task-definition.normalized.json
          mv task-definition.normalized.json task-definition.json
      - id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
